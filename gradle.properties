# Run Gradle in the foreground (no background daemon). The Gradle daemon runs detached
# from the user's console, so a TUI app launched via `gradlew run` would have no console
# attached and could not read real keyboard input (GetConsoleMode/CONIN$ would fail).
# With the daemon disabled, `gradlew run` runs attached to the current terminal and the
# app child process inherits that console, so JLine / the direct console reader work and
# the TUI stays inside the same window.
org.gradle.daemon=false

# Use plain console output. The rich (ANSI + live "> :run" progress) console would
# write build progress lines that leak into / sit below the LifeForge TUI. Plain output
# keeps the build quiet so only the application's own UI is displayed on screen.
org.gradle.console=plain
